server {
    listen 80;
    server_name timer-of-life.com www.timer-of-life.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://timer-of-life.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name timer-of-life.com www.timer-of-life.com;

    ssl_certificate /etc/letsencrypt/live/timer-of-life.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timer-of-life.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket — must be before /api/
    location /api/timer/ws {
        proxy_pass http://backend:8000/timer/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API proxy — strips /api prefix
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
